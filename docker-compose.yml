services:
  oracle-23ai:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-23ai
    restart: always
    environment:
      - ORACLE_PASSWORD=CineSeat123
    ports:
      - "1521:1521"
    volumes:
      - ./database:/opt/oracle/scripts/setup:ro
      - ./database:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
